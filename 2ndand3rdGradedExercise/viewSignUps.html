<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Signups</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('https://cdn.wallpapersafari.com/57/73/Nz4sQl.png') no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; }

        .controls {
            margin-bottom: 20px;
            padding: 10px;
            background: #eee;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 300px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #007BFF;
            color: white;
        }

        tr:nth-child(even) { background-color: #f2f2f2; }
        
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .counter {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Club Signup Database</h1>
    
    <div class="controls">
        <div>
            <label for="clubFilter"><strong>Filter by Club:</strong></label>
            <select id="clubFilter" onchange="filterSignups()">
                <option value="all">-- Show All Signups --</option>
                <optgroup label="Club A Group">
                    <option value="aksis">Aksis (Social Action)</option>
                    <option value="alianti">Alianti (Frisbee)</option>
                    <option value="astrosoc">Astrosoc (Astronomy)</option>
                    <option value="bakeClub">Bake Club (Bake)</option>
                    <option value="bravura">Bravura (Symphonic Ensemble)</option>
                    <option value="celluloid">Celluloid (Film)</option>
                    <option value="computron">Computron (Computer Science)</option>
                    <option value="intyale">Intyale (TTRPG)</option>
                    <option value="invictus">Invictus (Debate)</option>
                    <option value="kamalayan">Kamalayan (Filipino Theatre)</option>
                    <option value="kislap">Kislap (Volleyball)</option>
                    <option value="munwha">Munwha (Asian Culture Appreciation)</option>
                    <option value="pisayXYZ">Pisay.XYZ (Maker)</option>
                    <option value="sca">SCA (Catholic)</option>
                    <option value="sigasig">Sigasig (Taekwondo)</option>
                    <option value="volant">Volant (Badminton)</option>
                </optgroup>
                <optgroup label="Club B Group">
                    <option value="acts">ACTS (Christian)</option>
                    <option value="atom">ATOM (Chemistry)</option>
                    <option value="care">CARE (Environment)</option>
                    <option value="ellipsis">Ellipsis (Literature)</option>
                    <option value="exposure">Exposure (Photography)</option>
                    <option value="labuyo">Labuyo (Football)</option>
                    <option value="loqui">Loqui (Foreign Language)</option>
                    <option value="pallastro">Pallastro (Basketball)</option>
                    <option value="polvere">Polvere (FPS Games)</option>
                    <option value="pyhs">PYHS (Physics)</option>
                    <option value="sapienara">Sapienara (Sudoku)</option>
                    <option value="sarsPlus">SARS+ (Research)</option>
                    <option value="sightlines">Sightlines (English Theatre)</option>
                    <option value="tomorrow">Tomorrow (Data Science)</option>
                    <option value="flux">Flux (Swimming)</option>
                    <option value="animo">Animo (Chess Club)</option>
                    <option value="yvs">YVS (Youth Venture Society)</option>
                </optgroup>
            </select>
        </div>
        <div class="counter" id="totalCount">Total Signups: 0</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Grade & Sec</th>
                <th>Role</th>
                <th>Club A</th>
                <th>Club B</th>
                <th>Date Applied</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <a href="Q3_2GSodiumJacob.html" class="btn-back">Back to Form</a>
</div>

<script>
    const storedData = localStorage.getItem('clubSignups');
    let allSignups = [];

    if (storedData) {
        allSignups = JSON.parse(storedData);
    }

    window.onload = function() {
        renderTable(allSignups);
    };

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const counter = document.getElementById('totalCount');
        
        tbody.innerHTML = ''; 

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="no-data">No signups found.</td></tr>';
            counter.textContent = 'Total Signups: 0';
            return;
        }

        data.forEach(student => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${student.studentID}</td>
                <td>${student.fullName}</td>
                <td>Gr. ${student.gradeLevel} - ${student.section}</td>
                <td style="text-transform: capitalize;">${student.role}</td>
                <td>${student.preferredClubA}</td>
                <td>${student.preferredClubB}</td>
                <td>${student.timestamp}</td>
            `;
            tbody.appendChild(tr);
        });

        counter.textContent = `Total Signups: ${data.length}`;
    }

    function filterSignups() {
        const filterValue = document.getElementById('clubFilter').value;
        
        if (filterValue === 'all') {
            renderTable(allSignups);
        } else {
            const filteredData = allSignups.filter(student => 
                student.preferredClubA === filterValue || 
                student.preferredClubB === filterValue
            );
            renderTable(filteredData);
        }
    }
</script>

</body>
</html>
