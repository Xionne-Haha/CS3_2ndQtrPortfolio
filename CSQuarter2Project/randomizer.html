<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gameboy Pedia - Genre Catalogue</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* Essential layout to push footer down */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            /* Using the transparent background you liked */
            background: url('https://mir-s3-cdn-cf.behance.net/project_modules/fs/9bc27292880429.5e569ff84e4d0.gif') no-repeat center center fixed !important;
            background-size: cover !important;
            color: #E3E4FA;
            font-family: 'Press Start 2P', monospace;
        }

        header {
            background: rgba(41, 57, 97, 0.9);
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 4px solid rgba(44, 73, 127, 0.8);
        }

        main {
            flex: 1; /* Pushes the footer to the bottom */
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            background: rgba(41, 57, 97, 0.85); /* Transparent panel */
            border-radius: 8px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #dice-image {
            display: block;
            width: 300px; 
            height: 300px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #dice-image:hover {
            transform: scale(1.1); /* Slight grow effect when hovering */
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: rgba(44, 73, 127, 0.9);
            border-top: 2px solid rgba(136, 151, 189, 0.5);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gameboy Pedia</h1>
        <p>Pixel Perfect Information &mdash; Explore the World of Video Game Genres.</p>
    </header>

    <main>
         <img 
            id="dice-image" 
            src="https://github.com/tay-lor-AI/WDProjStrontiumTancincoYu/blob/main/images/favicon.gif?raw=true" 
            alt="Roll the Dice"
        >
    </main>

    <footer>
        <p>&copy; 2026 Gameboy Pedia. All rights reserved.</p>
    </footer>

    <script>
        const pages = [
            "action.html",
            "adventure.html",
            "fps.html",
            "horror.html",
            "rpg.html",
            "simulation.html",
        ];

        document.getElementById("dice-image").addEventListener("click", () => {
            const randomIndex = Math.floor(Math.random() * pages.length);
            window.location.href = pages[randomIndex];
        });
    </script>

    <div class="hidden-music">
    <iframe 
        width="100%" 
        height="100%" 
        src="https://www.youtube.com/embed/EtZ2m2Zm3vY?autoplay=1&loop=1&playlist=EtZ2m2Zm3vY&controls=0" 
        title="Background Music" 
        frameborder="0" 
        allow="autoplay">
    </iframe>
</div>
    
</body>
</html>
