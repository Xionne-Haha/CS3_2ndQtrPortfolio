<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gameboy Pedia - Entry</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* Centering the small box on the page */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh; /* Reduced height to keep it elevated */
            padding: 20px;
            font-size: 1rem; /* NEW: makes all text inside bigger */
        }

        /* Making the box smaller and more compact */
        .form-card {
            background: rgba(41, 57, 97, 0.9);
            border: 4px solid rgba(44, 73, 127, 0.8);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
            padding: 25px; /* Less padding for a tighter fit */
            width: 100%;
            max-width: 300px; /* Reduced from 400px to 300px */
            text-align: center;
            font-size: 1rem; /* NEW: ensures everything inside is bigger */
        }

        .form-card h2 {
            font-size: 1.2rem; /* was 0.8rem */
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-box {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem; /* was 0.5rem */
            color: #8897BD;
        }

        input {
            width: 100%;
            padding: 8px; /* Thinner padding */
            background: rgba(38, 40, 66, 0.9);
            border: 2px solid rgba(44, 73, 127, 0.8);
            color: #E3E4FA;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.95rem; /* was 0.55rem */
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: rgba(136, 151, 189, 0.8);
            border: 3px solid rgba(44, 73, 127, 0.8);
            color: #262842;
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem; /* was 0.6rem */
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #E3E4FA;
            transform: scale(1.02);
        }
    </style>
</head>
<body> 

    <header>
        <h1>Gameboy Pedia</h1>
        <p>Welcome to the Gaming Vault</p>
    </header>

    <main class="container">
        <div class="form-card">
            <section class="genre">
                <h2>Join our Community</h2>
            </section>

            <form id="loginForm">
                <div class="input-box">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="user@pedia.com" required>
                </div>

                <div class="input-box">
                    <label for="password">Password</label>
                    <input type="password" id="login-password" name="login-password" placeholder="**********" required>

                <div class="input-box" style="margin-top: 20px;">
                    <label for="login-nickname">Nickname</label>
                    <input type="text" id="login-nickname" name="login-nickname" placeholder="Player 1" required>
                </div>

                <button type="submit">START GAME</button>
            </form>

            <script>
                document.getElementById("loginForm").addEventListener("submit", function(event) {
                    event.preventDefault();
                
                    const enteredNickname = document.getElementById("login-nickname").value;
                    const enteredPassword = document.getElementById("login-password").value;
                
                    const storedNickname = localStorage.getItem("nickname");
                    const storedPassword = localStorage.getItem("password");
                
                    if (enteredNickname === storedNickname && enteredPassword === storedPassword) {
                        alert("Access granted! Welcome " + storedNickname);
                        window.location.href = "randomizer.html";
                    } else {
                        alert("Incorrect nickname or password!");
                    }
                });
            </script>

        <p style="margin-top: 15px; text-align: center;">
            Don’t have an account?
            <a href="signups.html">Create one here</a>
        </p>
        </div>
    </main>

    <footer>
        &copy; 2026 Gameboy Pedia. Pixel Perfect Information.
    </footer>
</body>
</html>
