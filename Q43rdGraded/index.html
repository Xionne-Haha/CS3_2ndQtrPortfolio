<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta name="author" content="Clyde Xionne A. Jacob">
  <meta name="description" content="Nlogonia coordinate plotting and debugging">
  <meta name="keywords" content="testing, debugging, nlogonia">
  <title>CS 3 - Nlogonia</title>
  
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Poppins:wght@300&family=Roboto&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <nav>
      <a href="#table-section">Table</a>
      <a href="#input">Input</a>
      <a href="#output">Output</a>
      <a href="errorlogs.html">Error Logs</a>
    </nav>
    
    <h1 style="padding: 30px; text-align: center;">Xionne / Sodium - Mar 31 2026</h1>
    <h2 id="start" style="text-align: center;">Nlogonia</h2>
  </header>

  <section id="table-section">
    <table> 
      <tr class="rColor">
        <th>Input</th> <th>Output</th>
      </tr>
      <tr class="rColor"> 
        <td colspan="2">Sample Data</td>
      </tr>
      <tr> 
        <td>2 1 10 10</td> <td>NE</td>
      </tr>
      <tr> 
        <td>2 1 -10 1</td> <td>divisa</td>
      </tr>
      <tr> 
        <td>2 1 0 33</td> <td>NO</td>
      </tr>
      <tr class="rColor"> 
        <td colspan="2">For Current Input</td>
      </tr>
      <tr> 
        <td id="in1">0 0 0 0</td> <td id="out1">divisa</td>
      </tr>
    </table>
    <hr>
  </section>
  
  <section id="input" style="text-align: center;">
    <h2>Input</h2>
  
    <h4>Axis Reference (Division Point N, M):</h4>
    <p>
      <input type="number" id="x0" placeholder="N (e.g. 2)">
      <input type="number" id="y0" placeholder="M (e.g. 1)">
    </p>
    
    <h4>Residence Coordinates (X, Y):</h4>
    <p>
      <input type="number" id="x" placeholder="X (e.g. 10)"> 
      <input type="number" id="y" placeholder="Y (e.g. 10)">
    </p>
    <button onclick="handlePlot()">Plot</button>
  </section>
  
  <section id="output" style="text-align: center;">
    <h2>Output</h2>
  
    <div id="coordinatePlane">
        <div id="xAxis" class="axis"></div>
        <div id="yAxis" class="axis"></div>
        </div>
    <hr>
  </section>
  
  <footer style="text-align: center; padding: 20px;">
    <a href="https://facebook.com"><div class="icon facebook">FB</div></a>
    <a href="https://twitter.com"><div class="icon twitter">TW</div></a>
    <a href="https://github.com"><div class="icon github">GH</div></a>
  </footer>
  
  <script defer src="script.js"></script>
</body>
</html>
