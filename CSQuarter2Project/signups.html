<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gameboy Pedia - Entry</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* Centering the small box on the page */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh; /* Reduced height to keep it elevated */({})
            padding: 20px;
        }

        /* Making the box smaller and more compact */
        .form-card {
             background: rgba(41, 57, 97, 0.9);
             border: 4px solid rgba(44, 73, 127, 0.8);
             box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
             padding: 35px;
             width: 100%;
             max-width: 450px;
             text-align: center;
        } 

        .form-card h2 {
             font-size: 1.5rem;
             margin-bottom: 20px;
             line-height: 1.4;
             font-family: 'Fredoka', sans-serif;
        }


        .input-box {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1rem; /* Shrunk label font */
            color: #8897BD;
        }

        input {
            width: 100%;
            padding: 8px; /* Thinner padding */
            background: rgba(38, 40, 66, 0.9);
            border: 2px solid rgba(44, 73, 127, 0.8);
            color: #E3E4FA;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem; /* Smaller text for the input */
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: rgba(136, 151, 189, 0.8);
            border: 3px solid rgba(44, 73, 127, 0.8);
            color: #262842;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #E3E4FA;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <header>
        <h1>Gameboy Pedia</h1>
        <p>Welcome to the Gaming Vault</p>
    </header>

    <main class="container">
        <div class="form-card">
            <section class="genre">
                <h2>Join our Community</h2>
            </section>

            <form id="signupForm">
                <div class="input-box">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="user@pedia.com" required>
                </div>

                <div class="input-box" style="margin-top: 20px;">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" name="nickname" placeholder="Player 1" required>
                </div>

                <div class="input-box">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="**********" required>
                </div>

                <div class="input-box">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="**********" required>
                </div>

                <button type="submit">Return to the Gate</button>
            </form>

            <script>
                document.getElementById("signupForm").addEventListener("submit", function(event) {
                    event.preventDefault();
                
                    const email = document.getElementById("email").value;
                    const nickname = document.getElementById("nickname").value;
                    const password = document.getElementById("password").value;
                    const confirmPassword = document.getElementById("confirm-password").value;
                
                    if (password !== confirmPassword) {
                        alert("Passwords do not match!");
                        return;
                    }
                
                    localStorage.setItem("email", email);
                    localStorage.setItem("nickname", nickname);
                    localStorage.setItem("password", password);
                
                    window.location.href = "index.html";
                });
                </script>
        </div>
    </main>

    <footer>
        &copy; 2026 Gameboy Pedia. Pixel Perfect Information.
    </footer>

    <div class="hidden-music">
    <iframe 
        width="100%" 
        height="100%" 
        src="https://www.youtube.com/embed/EtZ2m2Zm3vY?autoplay=1&loop=1&playlist=EtZ2m2Zm3vY&controls=0" 
        title="Background Music" 
        frameborder="0" 
        allow="autoplay">
    </iframe>
</div>

</body>
</html>
